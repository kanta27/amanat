<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amanat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5l8 3.4v5.6c0 4.8-3.3 9-8 10.2-4.7-1.2-8-5.4-8-10.2V5.9l8-3.4z' fill='%231B3A8C'/%3E%3Cpath d='M8.5 12l2.4 2.4 4.6-4.8' stroke='%23F5B51F' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="Amanat: find and protect a family's financial assets. Product case study prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13296B; --ink-2:#2B3B5C; --muted:#64749A; --faint:#93A0BE;
  --blue:#2D5BD7; --blue-deep:#1B3A8C; --blue-mid:#4A77E0;
  --blue-light:#D9E4FB; --blue-tint:#EDF3FE;
  --yellow:#F5B51F; --yellow-deep:#9A6E05;
  --paper:#F6F9FF; --card:#FFFFFF; --line:#DCE5F5; --line-soft:#EDF2FB;
  --amber:#9A6E05; --amber-bg:#FEF3D8;
  --clay:#C8402F; --clay-bg:#FDEBE8;
  --ok:#0F7F58; --ok-bg:#E0F3EC;
  --r-lg:16px; --r:11px; --r-sm:8px;
  --sh:0 1px 2px rgba(19,41,107,.06), 0 1px 3px rgba(19,41,107,.05);
  --sh-lift:0 10px 26px rgba(19,41,107,.14);
  --display:'Plus Jakarta Sans',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-deep)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.18;color:var(--ink)}
h1{font-size:28px}h2{font-size:21px}h3{font-size:16px;font-weight:700}
.mono{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#root{height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.brand small{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;padding-top:3px}
.topbar .sp{flex:1}
.seg{display:flex;background:var(--blue-tint);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.ghost{padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;color:var(--muted);border:1px solid var(--line)}
.ghost:hover{background:var(--blue-tint);color:var(--ink)}

/* device frame */
.stage{flex:1;display:flex;justify-content:center;padding:0;min-height:0}
.stage.mobile{overflow-y:auto;align-items:flex-start}
.stage.mobile{padding:26px 16px;background:repeating-linear-gradient(45deg,#F1F0EC,#F1F0EC 10px,#EDECE7 10px,#EDECE7 20px)}
.device{width:100%;display:flex;flex-direction:column;min-height:0;height:100%}
.stage.mobile .device{width:392px;max-width:100%;height:788px;background:var(--paper);border:9px solid #232825;border-radius:34px;overflow:hidden;box-shadow:0 18px 50px rgba(31,36,33,.22);position:relative}
.stage.mobile .device::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:21px;background:#232825;border-radius:0 0 13px 13px;z-index:60}

/* layout */
.layout{flex:1;display:flex;min-height:0}
.side{width:206px;flex-shrink:0;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
.side .lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px 5px}
.side button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--ink-2);text-align:left;width:100%}
.side button:hover{background:var(--blue-tint)}
.side button[aria-current="page"]{background:var(--blue-tint);color:var(--blue-deep);font-weight:600}
.side button svg{flex-shrink:0;opacity:.75}
.side button[aria-current="page"] svg{opacity:1}
.side .pill{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;font-weight:600;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.content{flex:1;overflow-y:auto;min-width:0;min-height:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 26px 72px}
.tabbar{display:none}

/* mobile */
.m .layout{flex-direction:column}
.m .side{display:none}
.m .content{padding-bottom:4px}
.m .wrap{padding:18px 15px 26px}
.m .topbar{padding:12px 15px 9px}
.m .tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding:7px 4px 19px;flex-shrink:0}
.m .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:10px;font-weight:500;color:var(--faint);border-radius:var(--r-sm);position:relative}
.m .tabbar button[aria-current="page"]{color:var(--blue-deep)}
.m .tabbar .dot{position:absolute;top:3px;right:50%;margin-right:-17px;width:7px;height:7px;background:var(--clay);border-radius:50%}
.m h1{font-size:23px}.m h2{font-size:18px}
.m .grid-2,.m .grid-3{grid-template-columns:1fr}
.m .split{flex-direction:column}
.m .hero-ill{display:none}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{box-shadow:none}
.card+.card{margin-top:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.split{display:flex;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:7px}
.sub{color:var(--muted);font-size:13.5px}
.tiny{font-size:11.5px;color:var(--faint)}
.hr{height:1px;background:var(--line-soft);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;background:var(--blue-deep);color:#fff;transition:background .15s}
.btn:hover{background:#163275}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{background:var(--blue-tint)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--blue-tint);color:var(--blue-deep);white-space:nowrap}
.badge.warn{border:1px solid #F1DCA6}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.bad{background:var(--clay-bg);color:var(--clay)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.mock{background:#EEF1F8;color:var(--muted);font-weight:500}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue-light);border-color:var(--blue)}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty h3{margin-bottom:6px;color:var(--ink)}

/* list rows */
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:none}
.item .ico{width:34px;height:34px;border-radius:9px;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue-deep)}
.item .bd{flex:1;min-width:0}
.item .t{font-weight:600;font-size:13.5px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* ring */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--display);font-size:27px;font-weight:800;line-height:1;color:var(--ink)}
.ring .num span{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.rd{display:flex;flex-direction:row-reverse;align-items:center;gap:9px}
.rd .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.rd .bar i{display:block;height:100%;background:var(--blue)}
.rd .lb{width:200px;flex-shrink:0;color:var(--muted)}
.m .rd{flex-direction:column;align-items:stretch;gap:5px}
.m .rd .lb{width:auto}
.m .rd .bar{flex:none;width:100%;height:6px}
.m .ring{width:84px;height:84px}
.m .ring svg{width:84px;height:84px}
.m .ring-wrap{gap:13px}

/* stepper */
.steps{display:flex;gap:5px;margin-bottom:20px}
.steps i{height:3px;flex:1;background:var(--line);border-radius:2px}
.steps i.on{background:var(--blue)}
.steps i.done{background:var(--blue-deep)}

/* chooser */
.chooser{max-width:880px;margin:0 auto;padding:40px 26px 60px;position:relative}
.chooser::before{content:'';position:absolute;top:0;left:-50vw;right:-50vw;height:356px;background:var(--blue-tint);clip-path:polygon(0 0,100% 0,100% 76%,0 100%);z-index:0}
.chooser>*{position:relative;z-index:1}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco i{position:absolute;width:15px;height:15px;opacity:.6}
.deco i::before,.deco i::after{content:'';position:absolute;background:var(--blue-mid);border-radius:1px}
.deco i::before{left:0;top:6px;width:15px;height:3px}
.deco i::after{top:0;left:6px;width:3px;height:15px}
.deco i.y::before,.deco i.y::after{background:var(--yellow);opacity:.95}
.m .deco{display:none}
.m .chooser::before{height:250px}
.chooser .lead{text-align:center;margin-bottom:30px}
.chooser .lead h1{font-size:34px;margin-bottom:10px}
.m .chooser{padding:22px 15px 30px}
.m .chooser .lead h1{font-size:26px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m .pick{grid-template-columns:1fr}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.pick button{position:relative;overflow:hidden}
.pick button::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--yellow);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.pick button:hover{border-color:var(--blue);box-shadow:var(--sh-lift);transform:translateY(-2px)}
.pick button:hover::after{transform:scaleX(1)}
.pick .ill{margin:-22px -22px 16px;padding:18px 0 0;background:var(--blue-tint);display:flex;justify-content:center;align-items:flex-end;min-height:198px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
.pick .ill img{display:block}
.hero-art{display:flex;justify-content:center;margin:4px 0 18px}
.hero-art img{max-width:100%}
.pick h3{font-size:18px;margin-bottom:6px}
.pick p{font-size:13px;color:var(--muted);line-height:1.5}
.pick .go{display:inline-flex;align-items:center;gap:6px;margin-top:13px;font-size:12.5px;font-weight:600;color:var(--blue-deep)}

/* lead cards */
.lead-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card)}
.lead-card+.lead-card{margin-top:9px}
.lead-card .hd{display:flex;align-items:flex-start;gap:10px}
.m .lead-card .hd{flex-wrap:wrap}
.m .lead-card .hd>select{margin-left:42px;width:calc(100% - 42px)}
.lk{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--blue-deep);text-decoration:none}
.lk:hover{text-decoration:underline}

/* pipeline */
.pipe{display:flex;gap:4px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.pipe button{flex:1;min-width:84px;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 6px;text-align:center;background:var(--card)}
.pipe button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint)}
.pipe b{display:block;font-family:var(--display);font-size:17px;font-weight:800;color:var(--ink)}
.pipe span{font-size:10.5px;color:var(--muted)}

/* copy chip */
.cp{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.cp:hover{border-color:var(--blue);background:var(--blue-tint)}

/* toast + sheet */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .22s;z-index:100}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(31,36,33,.38);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.sheet{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:470px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(31,36,33,.25)}
.sheet h2{margin-bottom:4px}
.sheet .act{display:flex;gap:9px;margin-top:18px}
.sheet .act .btn{flex:1}
.stage.mobile .scrim{position:absolute}

.note{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);background:var(--blue-tint);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.note.warn{background:var(--amber-bg)}
.note b{font-weight:600}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px 0;white-space:nowrap}
td{padding:10px 10px 10px 0;border-top:1px solid var(--line-soft);vertical-align:top}
.ol{counter-reset:s;list-style:none}
.ol li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:13px}
.ol li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--blue-tint);color:var(--blue-deep);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ck{list-style:none}
.ck li{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.ck li:last-child{border:none}
.ck input{margin-top:3px;accent-color:var(--blue-deep);width:15px;height:15px;flex-shrink:0}

/* family tree */
.tree{display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 0}
.gen{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;position:relative}
.gen+.gen::before{content:'';position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.gen.others{padding-top:12px;border-top:1px dashed var(--line)}
.gen.others::before{display:none}
.node{border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:118px;text-align:center;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:3px}
.node b{font-size:13px;font-weight:600}
.node span{font-size:11px;color:var(--muted)}
.node i{font-style:normal;margin-top:3px}
.node.heir{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.node.me{background:var(--blue-deep);border-color:var(--blue-deep)}
.node.me b,.node.me span{color:#fff}
.tsep{width:1px;height:38px;background:var(--line);margin:0 6px}
.m .node{min-width:96px;padding:8px 9px}

/* live lookups */
.live{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px;background:var(--paper);font-size:13px}
.live .row{flex-wrap:wrap}
.live-badge{background:var(--ok-bg);color:var(--ok)}
.live-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--blue-tint);color:var(--blue-deep);font-size:12px;font-weight:600;white-space:nowrap}
.kw.c{justify-content:center}
.pick .kw{margin-top:10px}
.chat{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.chat .q{align-self:flex-end;background:var(--blue-deep);color:#fff;padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:85%}
.chat .a{align-self:flex-start;background:var(--blue-tint);padding:10px 13px;border-radius:12px 12px 12px 2px;max-width:92%;white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
"use strict";

/* ============================ icons ============================ */
const I = {
  shield:'<path d="M12 3l7 3v5c0 4.2-2.9 7.9-7 9-4.1-1.1-7-4.8-7-9V6l7-3z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  home:'<path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/>',
  bank:'<path d="M3 9l9-5 9 5"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8"/><path d="M3 20h18"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3 3 0 010 5.6"/><path d="M18 20c0-2.4-.9-4-2.3-4.7"/>',
  lock:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  back:'<path d="M19 12H5M11 18l-6-6 6-6"/>',

const KEYS = ['journey','assets','people','links','reporters','event','log','intake','step','leads','docs','trace','evidence','profile','lookup','succ','chat'];
let saveTimer=null, booted=false;
function save(){
  if(!booted) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const snap={}; KEYS.forEach(k=>snap[k]=S[k]);
    try{ localStorage.setItem('amanat_v1', JSON.stringify(snap)); }catch(e){}
    if(S.db&&S.uid){ try{ await S.db.collection('data/users/'+S.uid).doc('state').set({...snap, at:Date.now()}); }catch(e){} }
  },420);
}
async function boot(){
  let local=null;
  try{ const r=localStorage.getItem('amanat_v1'); if(r) local=JSON.parse(r); }catch(e){}
  if(local) KEYS.forEach(k=>{ if(local[k]!==undefined) S[k]=local[k]; });
  render();
  booted=true;
  const timer=setTimeout(()=>{},10000);
  try{
    const db=await claude.use('db'), user=await claude.use('user');
    if(db&&user){
      S.db=db; S.uid=await user.id();
      const doc=await db.collection('data/users/'+S.uid).doc('state').get();
      const d=doc&&doc.data?(doc.data.at?doc.data:null):null;
      if(d&&(!local||(d.at||0)>0&&!local.assets?.length&&!local.leads?.length)){
        KEYS.forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
        render();
      }
    }
  }catch(e){}
  clearTimeout(timer);
}

/* ============================ scoring ============================ */
const hasWill = () => ['signed','registered'].includes(S.succ&&S.succ.will);
const aLabel = a => TYPE_OF(a.type).via==='will' ? (a.ref||a.inst)
  : a.type==='loan' || S.assets.filter(x=>x.inst===a.inst).length>1 ? a.inst+' ('+TYPE_LABEL[a.type].toLowerCase()+')' : a.inst;
/* Where the nominee keeps the money rather than holding it for the heirs:
   life cover naming a spouse, parent or child (Insurance Act s.39(7), as amended in 2015), and statutory family benefits. */
const CLOSE_FAMILY = ['Spouse','Son','Daughter','Mother','Father'];
const beneficialNominee = (a, nom) => ['eps','edli','govpen'].includes(a.type)
  || (['insurance','pmjjby','health'].includes(a.type) && CLOSE_FAMILY.includes(nom.rel));
function readiness(){
  if(!S.assets.length) return {pct:0, parts:[]};
  const nomA = S.assets.filter(a=>TYPE_OF(a.type).via==='nom');
  const withNom = S.assets.filter(a=>S.links.some(l=>l.asset===a.id)).length;
  const regAtInst = nomA.filter(a=>a.nomAtInst==='yes').length;
  const withId = S.assets.filter(a=>a.ref&&a.ref.trim()).length;
  const n=S.assets.length;
  let parts=[
    {k:'Nominee set', v:withNom, n, w:.33},
    {k:'Registered at institution', v:regAtInst, n:nomA.length, w:.27},
    {k:'Identifier', v:withId, n, w:.10},
    {k:'Will and heirs aligned', v:(hasWill()?1:0)+(conflicts().length?0:1), n:2, w:.20},
    {k:'Death reporters', v:Math.min(S.reporters.length,2), n:2, w:.10}
  ].filter(p=>p.n>0);
  const W=parts.reduce((s,p)=>s+p.w,0);
  const pct=Math.round(parts.reduce((s,p)=>s+(p.v/p.n)*p.w,0)/W*100);
  return {pct, parts};
}
function gaps(){
  const g=[], toFam=()=>{S.view='r-family';render();};
  if(S.assets.length&&!(S.profile&&S.profile.pan)) g.push({sev:'bad', t:'Your family cannot find this registry yet', s:'Add your name and PAN.', go:()=>{modal(mProfile());bindModal();}});
  S.assets.forEach(a=>{
    const via=TYPE_OF(a.type).via;
    if(!S.links.some(l=>l.asset===a.id)) g.push({sev:'bad', t:`${aLabel(a)} has no nominee designated`, s:via==='debt'?'Lender and loan cover unknown to family.':'Nobody will be told.', go:()=>{S.view='r-assets';render();}});
    else if(via==='nom'&&a.nomAtInst!=='yes') g.push({sev:'warn', t:`${aLabel(a)} is not nominated at the institution`, s:'Family will need a heir certificate.', go:()=>{S.view='r-assets';render();}});
  });
  const willOnly=S.assets.filter(a=>TYPE_OF(a.type).via==='will');
  if(!hasWill()) g.push({sev:willOnly.length?'bad':'warn', t:'You have no signed will', s:willOnly.length
      ? `${willOnly.map(aLabel).join(', ')}: no nominee possible. Law decides.`
      : 'Only a will decides who keeps each holding.', go:toFam});
  const c=conflicts();
  if(c.length) g.push({sev:'warn', t:`${c.length} holding${c.length>1?'s go':' goes'} to a nominee who is not your only heir`, s:'Nominee must share with other heirs.', go:toFam});
  if(S.assets.some(a=>a.type==='epf')){
    const miss=['eps','edli'].filter(k=>!S.assets.some(a=>a.type===k));
    if(miss.length) g.push({sev:'warn', t:'Your EPF carries a pension and insurance you have not recorded', s:`Add ${miss.map(k=>k==='eps'?'EPS-95 pension':'EDLI cover').join(' + ')}.`, go:()=>{modal(mAsset(miss[0]));bindModal();}});
  }
  if(S.reporters.length<2) g.push({sev:'warn', t:'Fewer than two death reporters set', s:'Two needed to trigger disclosure.', go:()=>{S.view='r-safeguards';render();}});
  return g.sort((a,b)=>(a.sev==='bad'?0:1)-(b.sev==='bad'?0:1));
}

/* ============================ succession ============================ */
/* Default (intestate) shares among the people the holder has added. Simplified: it assumes everyone listed is alive,
   ignores predeceased children's lines, and covers the main rule of each law. It is guidance, not legal advice. */
const LAWS = {
  hindu:{n:'Hindu, Sikh, Jain or Buddhist', act:'Hindu Succession Act, 1956'},
  muslim:{n:'Muslim', act:'Muslim personal law (Shariat Application Act, 1937)'},
  christian:{n:'Christian, or a civil marriage', act:'Indian Succession Act, 1925'},
  parsi:{n:'Parsi', act:'Indian Succession Act, 1925 (Parsi rules)'}
};
function heirShares(law, gender, people){
  const by=r=>people.filter(p=>p.rel===r);
  const spouse=by('Spouse'), kids=[...by('Son'),...by('Daughter')], mother=by('Mother'), father=by('Father'), sibs=[...by('Brother'),...by('Sister')];
  const out=new Map(); const give=(list,amt)=>list.forEach(p=>out.set(p.id,(out.get(p.id)||0)+amt/list.length));
  if(law==='hindu'){
    const cls1 = gender==='female' ? [...spouse,...kids] : [...spouse,...kids,...mother];
    if(cls1.length) cls1.forEach(p=>out.set(p.id,1/cls1.length));
    else if(gender==='female'&&(mother.length||father.length)) give([...mother,...father],1);
    else if(father.length) give(father,1);
    else if(sibs.length) give(sibs,1);
  } else if(law==='christian'){
    if(spouse.length&&kids.length){ give(spouse,1/3); give(kids,2/3); }
    else if(spouse.length){ const kin=father.length?father:[...mother,...sibs]; if(kin.length){give(spouse,1/2); give(kin,1/2);} else give(spouse,1); }
    else if(kids.length) give(kids,1);
    else if(father.length) give(father,1);
    else if(mother.length||sibs.length) give([...mother,...sibs],1);
  } else if(law==='parsi'){
    if(kids.length){ const units=spouse.length+kids.length+(mother.length+father.length)/2;
      [...spouse,...kids].forEach(p=>out.set(p.id,1/units)); [...mother,...father].forEach(p=>out.set(p.id,.5/units)); }
    else if(spouse.length){ const par=[...mother,...father]; if(par.length){give(spouse,1/2); give(par,1/2);} else give(spouse,1); }
    else if(mother.length||father.length) give([...mother,...father],1);
    else if(sibs.length) give(sibs,1);
  } else if(law==='muslim'){
    const ch=kids.length>0;
    if(spouse.length) give(spouse, gender==='female' ? (ch?1/4:1/2) : (ch?1/8:1/4));
    if(mother.length) give(mother, ch?1/6:1/3);
    if(father.length&&ch) give(father,1/6);
    const fixed=[...out.values()].reduce((s,v)=>s+v,0);
    const sons=by('Son'), daus=by('Daughter');
    if(sons.length){ const units=sons.length*2+daus.length, rest=Math.max(0,1-fixed);
      sons.forEach(p=>out.set(p.id,rest*2/units)); daus.forEach(p=>out.set(p.id,rest/units)); }
    else { if(daus.length) give(daus, daus.length>1?2/3:1/2);
      const left=1-[...out.values()].reduce((s,v)=>s+v,0);
      if(left>0&&father.length) give(father,left); else if(left>0&&!out.size&&sibs.length) give(sibs,left); }
    const tot=[...out.values()].reduce((s,v)=>s+v,0);
    if(tot>0) out.forEach((v,k)=>out.set(k,v/tot));
  }
  return people.map(p=>({...p, share:out.get(p.id)||0}));
}
const pctStr = v => v>0 ? (Math.round(v*1000)/10)+'%' : '—';
function heirs(){ return heirShares(S.succ.law, S.succ.gender, S.people); }
/* holdings where the institution's nominee is not the only person the law would give it to */
function conflicts(){
  if(hasWill()) return [];
  const H=heirs(), legal=H.filter(h=>h.share>0);
  if(!legal.length) return [];
  return S.assets.filter(a=>TYPE_OF(a.type).via==='nom'&&a.nomAtInst==='yes'&&a.nomPerson).map(a=>{
    const nom=H.find(h=>h.id===a.nomPerson); if(!nom) return null;
    if(nom.share>=0.999 || beneficialNominee(a, nom)) return null;
    return {asset:a, nominee:nom, others:legal.filter(h=>h.id!==nom.id), notHeir:nom.share===0};
  }).filter(Boolean);
}

  const banks=(a.banks||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
  if(banks.length) banks.forEach(b=>add('udgam','bank',b,'Dormant 10+ yrs → held by RBI',92));
  else add('udgam','bank','Bank deposits (bank unknown)','Search by name + PAN',70);

  if(a.ins==='Yes') add('bima','insurance','Life insurance policy','Maturities often unclaimed',90);
  else if(a.ins==='I think so'||a.ins==='I don’t know') add('bima','insurance','Possible life insurance','Agent-sold policies get forgotten',62);

  else if(a.shares==='I don’t know') add('iepf','demat','Possible shareholding','Free name search',55);

  if(emps.length) emps.forEach(e=>add('epfo','epf','Provident fund — '+e,'One PF ID per employer',88));
  else add('epfo','epf','Provident fund','Inoperative accounts common',66);
  const pvt = emps.length>0 || a.work==='Salaried, private sector';
  if(pvt){
    add('epfo','eps','EPS-95 family pension','Monthly spouse pension · Form 10D · most missed',93);
    add('epfo','edli','EDLI insurance','₹2.5–7 lakh cover, no premium · Form 5IF',91);
    add('','gratuity','Gratuity and final dues'+(emps.length?' — '+emps[emps.length-1]:''),'Gratuity, leave, salary, group cover · one HR letter',82);
  }
  if(['Central or state government','Defence or railways','Retired, drawing a pension'].includes(a.work)){
    add('','govpen','Family pension','Often the largest benefit · pension bank',96);
    if(a.work!=='Retired, drawing a pension') add('nps','nps','NPS account','Post-2004 govt staff · corpus to nominee',85);
  }

  if(a.work!=='Did not work outside home') add('','pmjjby','PMJJBY / PMSBY cover','₹2 lakh each · look for a yearly debit',76);
  if(a.gold==='Yes, a bank locker') add('','locker','Bank locker','Joint inventory · ask every bank',89);
  else if(a.gold==='Yes, at home') add('','gold','Gold and jewellery at home','No register · agree a family settlement',62);
  else if(a.gold==='Gold bonds or digital gold') add('','sgb','Sovereign Gold Bonds or digital gold','Half-yearly interest in statements',84);
  else if(a.gold==='I don’t know') add('','locker','Possible bank locker','Look for locker rent debits',52);
  if(a.prop==='Yes, in their name'||a.prop==='Yes, jointly') add('land','property','Land, house or flat','Mutation to heirs · until then, no sale',90);
  else if(a.prop==='Ancestral, never transferred') add('land','property','Ancestral property','Earlier generation’s name · mutate with all heirs',86);
  else if(a.prop==='I don’t know') add('land','property','Possible landholding','Search by owner + village',54);
  if(a.veh==='Yes') add('vahan','vehicle','Vehicle','Form 31 at RTO · within 3 months',70);
  if(a.loan==='Yes'||a.loan==='I think so') add('cibil','loan','Loans and credit cards','Credit report · check loan cover first',80);
  else if(a.loan==='I don’t know') add('cibil','loan','Check for loans','Credit report lists every loan',57);
  add('clp','bank','Common Landing Portal search','One search: deposits, insurance, shares, MFs',87);
  if(a.post==='Yes') add('post','post','Post office savings, NSC or KVP','Rarely tracked online',80);
  else if(a.post==='I don’t know') add('post','post','Possible post office savings','Common with older savers',48);
  add('mitra','mf','Mutual fund folios','All AMCs, one PAN',a.pan==='Yes'?86:58);
  if(a.pan==='Yes') add('tax','tax','Tax records trace (AIS and Form 26AS)','Strongest route · reveals unknown institutions',99);

  if(a.email==='Yes, email'||a.email==='Both') add('email','email','Their email inbox','Statements arrive here · richest source',95);
  return out.sort((x,y)=>y.score-x.score);
}

function ringSvg(pct){
  const R=44,C=2*Math.PI*R;
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="${R}" stroke="var(--line)" stroke-width="9" fill="none"/>
    <circle cx="52" cy="52" r="${R}" stroke="var(--blue-deep)" stroke-width="9" fill="none" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
    <div class="num"><b>${pct}</b><span>of 100</span></div></div>`;
}

      <div class="row" style="gap:10px;margin-top:8px;flex-wrap:wrap">

    <select data-st="${l.id}" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--card)">
      <option value="todo"${l.status==='todo'?' selected':''}>To check</option>
      <option value="found"${l.status==='found'?' selected':''}>Found</option>
      <option value="filed"${l.status==='filed'?' selected':''}>Claim filed</option>

    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
      ${l.fromReg?`<button class="btn sec sm" data-v="v-case">${ic('file',14)} Documents to claim it</button>`

       :p?`<a class="lk" href="${p.url}" target="_blank" rel="noopener">${ic('ext',13)} Open ${esc(p.n)}</a>

/* ---------- live public APIs (no keys, CORS-open) ---------- */
async function getJSON(url){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),9000);
  try{ const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) return {ok:false,status:r.status}; return {ok:true,data:await r.json()}; }
  catch(e){ return {ok:false,status:0}; } finally{ clearTimeout(t); }
}
const netMsg = what => 'Could not reach '+what+'. If you are viewing Amanat inside claude.ai, its security rules block outside lookups: open the standalone version (index.html on any web host) to use them. Otherwise, try again in a moment.';
async function lookupIFSC(code){
  code=String(code||'').trim().toUpperCase();
  if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(code)) return {ok:false,msg:'An IFSC is 11 characters: four letters, a zero, then six letters or digits.'};
  const r=await getJSON('https://ifsc.razorpay.com/'+code);
  if(r.ok) return {ok:true,data:r.data};
  return {ok:false,msg:r.status===404?'No branch has that IFSC. Check it against a cheque leaf or passbook.':netMsg('the IFSC directory')};
}
async function lookupPin(pin){
  pin=String(pin||'').replace(/\D/g,'');
  if(pin.length!==6) return {ok:false,msg:'A PIN code has six digits.'};
  const r=await getJSON('https://api.postalpincode.in/pincode/'+pin);
  const d=r.ok&&Array.isArray(r.data)?r.data[0]:null;
  if(d&&d.Status==='Success'&&d.PostOffice&&d.PostOffice.length) return {ok:true,data:d.PostOffice};
  return {ok:false,msg:r.ok?'No post offices found for that PIN code.':netMsg('the PIN code directory')};
}
async function searchMF(q){
  q=String(q||'').trim(); if(q.length<3) return {ok:false,msg:'Type at least three letters of the scheme name.'};
  const r=await getJSON('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q));
  if(r.ok&&Array.isArray(r.data)) return {ok:true,data:r.data.slice(0,8)};
  return {ok:false,msg:netMsg('the mutual fund directory')};
}

  const msgs=[{role:'user',content:sys+'\n\nReply "Understood." and wait for the question.'},{role:'assistant',content:'Understood.'},...S.chat.slice(-10)];

/* ===== lookup: did they use Amanat? ===== */
const maskPan = p => p ? p.slice(0,2)+'•••••'+p.slice(-3) : '';
const digits10 = s => String(s||'').replace(/\D/g,'').slice(-10);
const REL_MAP = {Spouse:'Spouse',Son:'Son or daughter',Daughter:'Son or daughter',Mother:'Parent',Father:'Parent',Brother:'Sibling',Sister:'Sibling','Lawyer or executor':'Executor or legal representative'};

function doLookup(pan,phone){
  pan=String(pan||'').trim().toUpperCase(); const ph=digits10(phone);
  const L={pan,phone,status:'nomatch'};
  if(S.profile&&S.profile.pan&&S.profile.pan.toUpperCase()===pan&&S.assets.length){
    const person=ph.length===10?S.people.find(p=>digits10(p.phone)===ph):null;
    if(person&&S.links.some(l=>l.person===person.id)) Object.assign(L,{status:'named',personId:person.id,holder:S.profile.name,stage:'report'});
    else Object.assign(L,{status:'notnamed',holder:S.profile.name});
  }
  S.lookup=L; logit('Registry lookup: '+L.status); save(); render();
}

function registryLeads(pid){
  return S.links.filter(l=>l.person===pid).map(l=>{
    const a=S.assets.find(x=>x.id===l.asset); if(!a) return null;
    return {id:uid(),portal:TYPE_OF(a.type).pid,type:a.type,label:a.inst,score:100,status:'found',note:'',fromReg:true,scope:l.scope,nomAtInst:a.nomAtInst,
      ref:l.scope==='Full detail'?(a.ref||''):'',
      why:(a.nomAtInst==='yes'?'Nominated · short route':'Not nominated · expect a legal heir certificate')
        +(l.scope==='Existence only'?' · existence only':l.scope==='Claim guidance only'?' · claim guidance only':'')};
  }).filter(Boolean);
}

function releaseRegistry(){
  const L=S.lookup, per=S.people.find(p=>p.id===L.personId);
  S.leads=registryLeads(L.personId);
  const held=S.leads.map(l=>S.assets.find(a=>a.inst===l.label)||{});
  const ins=t=>S.leads.some(l=>l.type===t);
  S.intake={name:L.holder,rel:REL_MAP[per&&per.rel]||'Other relative',
    nom:S.leads.some(l=>l.nomAtInst==='yes')?'Yes, on at least one holding':'No',pan:'Yes',
    banks:S.leads.filter(l=>l.type==='bank').map(l=>l.label).join(', ')};
  if(ins('insurance')) S.intake.ins='Yes';
  if(ins('demat')) S.intake.shares='Yes, and I have papers';
  if(ins('post')) S.intake.post='Yes';
  S.step=0; L.stage='released'; S.filter='all';
  logit('Registry disclosed to '+(per?per.name:'nominee')+' — '+S.leads.length+' holdings');
}

function mergeLeads(nw){
  const reg=S.leads.filter(l=>l.fromReg);
  if(!reg.length) return nw;
  const known=new Set(reg.map(l=>l.label.toLowerCase())), types=new Set(reg.map(l=>l.type));
  nw=nw.filter(l=>!known.has(l.label.toLowerCase())).map(l=>
    types.has(l.type)&&!/^(Provident fund —|Accounts in)/.test(l.label)
      ? {...l,why:'They recorded one — check for others they didn’t · '+l.why} : l);
  return [...reg,...nw];
}

    <div class="act"><button class="btn sec" data-close-btn>Cancel</button><button class="btn" data-save="trace">Add and create a lead</button></div></div>`;
}
function mPortal(pid){
  const p=PORTAL_OF(pid);
  return `<div class="sheet"><div class="row" style="gap:8px"><h2>${esc(p.n)}</h2><span class="badge mock">${esc(p.who)}</span></div>
    <p class="sub" style="margin:6px 0 14px">${esc(p.what)}</p>
    <div class="eyebrow">What you need</div>
    <ul class="ck" style="margin-bottom:12px">${p.need.map(n=>`<li style="border:none;padding:4px 0"><span style="color:var(--blue-deep);flex-shrink:0;margin-top:2px">${ic('check',14)}</span><div>${esc(n)}</div></li>`).join('')}</ul>
    <div class="eyebrow">What comes back</div><p class="sub" style="font-size:13px">${esc(p.out)}</p>
    <div class="note" style="margin-top:12px">${esc(p.note)}</div>
    <div class="act"><button class="btn sec" data-close-btn>Close</button><a class="btn" href="${p.url}" target="_blank" rel="noopener" style="text-decoration:none">${ic('ext',14)} Open ${esc(p.n)}</a></div></div>`;
}

/* ============================ events ============================ */
function bind(){
  const q=(s,f)=>el.querySelectorAll(s).forEach(f);
  const mq=(s,f)=>document.getElementById('modal').querySelectorAll(s).forEach(f);

  q('[data-dev]',b=>b.onclick=()=>{S.device=b.dataset.dev;render()});
  q('[data-j]',b=>b.onclick=()=>{S.journey=b.dataset.j;S.view=NAV[S.journey][0].v;
    if(S.journey==='recovery'&&!S.leads.length)S.view='v-plan';logit('Opened '+b.dataset.j);save();render()});
  q('[data-go="chooser"]',b=>b.onclick=()=>{S.journey=null;S.view=null;save();render()});
  q('[data-v]',b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  q('[data-gap]',b=>b.onclick=()=>gaps()[+b.dataset.gap].go());
  q('[data-f]',b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
  q('[data-gt]',b=>b.onclick=()=>{S.guideTab=b.dataset.gt;render()});
  q('[data-guide]',b=>b.onclick=()=>{S.guideTab=b.dataset.guide;S.view='v-guides';render()});
  q('[data-portal]',b=>b.onclick=()=>{modal(mPortal(b.dataset.portal));bindModal()});
  q('[data-route]',b=>b.onclick=()=>{modal(mRoute(b.dataset.route));bindModal()});
  q('[data-add-type]',b=>b.onclick=()=>{modal(mAsset(b.dataset.addType));bindModal()});
  q('[data-live]',b=>b.onclick=()=>runLive(b.dataset.live));
  ['ifsc','pin','mf'].forEach(k=>{const i=el.querySelector('#lv-'+k); if(i) i.onkeydown=e=>{if(e.key==='Enter')runLive(k)}});
  q('[data-ask]',b=>b.onclick=()=>askAI(b.dataset.ask));
  const ai=el.querySelector('#ask-in'); if(ai) ai.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askAI(ai.value)}};
  [['#sc-law','law'],['#sc-gender','gender'],['#sc-will','will']].forEach(([sel,k])=>{const x=el.querySelector(sel);
    if(x) x.onchange=()=>{S.succ={...S.succ,[k]:x.value};logit('Succession details updated: '+k);save();render()}});
  q('[data-copy]',b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('Copied')).catch(()=>toast('Copy blocked'))});

  q('[data-act]',b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='add-asset'){modal(mAsset());bindModal()}
    else if(a==='add-person'){modal(mPerson());bindModal()}
    else if(a==='add-trace'){modal(mTrace());bindModal()}
    else if(a==='seed'){seedRegistry();save();render();toast('Sample registry loaded')}
    else if(a==='seed-r'){seedRecovery();save();render();toast('Sample case loaded')}
    else if(a==='start-q'){S.step=0;S.view='v-intake';render()}
    else if(a==='redo-q'){S.step=0;S.view='v-intake';render()}
    else if(a==='q-back'){S.step=Math.max(0,S.step-1);render()}
    else if(a==='q-skip'){S.step++;save();render()}
    else if(a==='q-next'){const i=el.querySelector('#qin');if(i)S.intake[Q[S.step].id]=i.value.trim();S.step++;save();render()}
    else if(a==='sim'){S.event={stage:'waiting',reporters:2,at:Date.now()};logit('Death event simulated — 2 reports received, waiting period started');save();render();toast('Waiting period started')}
    else if(a==='release'){S.event.stage='released';logit('Disclosure released to designated people');save();render();toast('Disclosure released')}
    else if(a==='cancel-event'){S.event=null;logit('Death event cancelled');save();render();toast('Event cancelled')}
    else if(a==='profile'){modal(mProfile());bindModal()}
    else if(a==='lookup'){const p=el.querySelector('#lk-pan').value,ph=el.querySelector('#lk-phone').value;
      if(!/^[A-Za-z]{5}[0-9]{4}[A-Za-z]$/.test(p.trim())){toast('Enter a valid PAN');return}
      if(digits10(ph).length!==10){toast('Enter a 10-digit mobile number');return}
      doLookup(p,ph)}
    else if(a==='lookup-sample'){
      if(!S.assets.length) seedRegistry();
      if(!(S.profile&&S.profile.pan)){toast('Add your PAN in Protect first');return}
      const linked=S.people.filter(p=>p.phone&&S.links.some(l=>l.person===p.id));
      const pick=linked.find(p=>/Son|Daughter/.test(p.rel))||linked[0];
      if(!pick){toast('Name someone with a mobile number in Protect first');return}
      doLookup(S.profile.pan,pick.phone)}
    else if(a==='lookup-reset'){S.lookup=null;save();render()}
    else if(a==='report-death'){const c=el.querySelector('#lk-cert');
      if(!c||!c.checked){toast('Confirm you have the death certificate');return}
      S.lookup.stage='waiting';logit('Death reported by nominee');save();render();toast('Report received')}
    else if(a==='second-report'){S.lookup.second=true;logit('Second death report received');save();render()}
    else if(a==='release-reg'){releaseRegistry();save();render();toast('Record opened')}
    else if(a==='extend-search'){S.step=0;S.view='v-intake';render()}
    else if(a==='ask'){const i=el.querySelector('#ask-in');askAI(i&&i.value)}
    else if(a==='ask-clear'){S.chat=[];save();render()}
    else if(a==='inbox'){S.view='r-inbox';logit('Nominee view opened');save();render()}
    else if(a==='reset'){if(S.assets.length||S.leads.length){modal(`<div class="sheet"><h2>Reset the prototype?</h2>
      <p class="sub" style="margin:6px 0 2px">Clears both journeys. Can&rsquo;t be undone.</p>
      <div class="act"><button class="btn sec" data-close-btn>Keep it</button><button class="btn" data-save="reset" style="background:var(--clay)">Reset everything</button></div></div>`);bindModal()}
      else toast('Nothing to reset')}
  });

  q('[data-link]',b=>b.onclick=()=>{modal(mLink(b.dataset.link));bindModal()});
  q('[data-ref]',b=>{const l=S.leads.find(x=>x.id===b.dataset.ref);
    b.onclick=()=>{modal(mText('Reference number','UDRN, folio, policy or member ID.','Reference',l.ref,'ref',l.id));bindModal()}});
  q('[data-note]',b=>{const l=S.leads.find(x=>x.id===b.dataset.note);
    b.onclick=()=>{modal(mText('Note','What happened, what’s next.','Note',l.note,'note',l.id));bindModal()}});
  q('[data-del-a]',b=>b.onclick=()=>{S.assets=S.assets.filter(a=>a.id!==b.dataset.delA);S.links=S.links.filter(l=>l.asset!==b.dataset.delA);logit('Holding removed');save();render()});
  q('[data-del-p]',b=>b.onclick=()=>{const id=b.dataset.delP;S.people=S.people.filter(p=>p.id!==id);S.links=S.links.filter(l=>l.person!==id);S.reporters=S.reporters.filter(r=>r!==id);logit('Person removed');save();render()});
  q('[data-del-t]',b=>b.onclick=()=>{S.trace=S.trace.filter(t=>t.id!==b.dataset.delT);save();render()});
  q('[data-opt]',b=>b.onclick=()=>{S.intake[Q[S.step].id]=b.dataset.opt;S.step++;save();render()});
  q('[data-st]',s=>s.onchange=()=>{const l=S.leads.find(x=>x.id===s.dataset.st);l.status=s.value;logit(l.label+' → '+s.value);save();render()});
  q('[data-rep]',c=>c.onchange=()=>{const id=c.dataset.rep;
    S.reporters = c.checked ? [...S.reporters,id] : S.reporters.filter(r=>r!==id);
    logit('Death reporters updated');save();render()});
  q('[data-doc]',c=>c.onchange=()=>{S.docs[c.dataset.doc]=c.checked;save();render()});
  q('[data-ev]',c=>c.onchange=()=>{S.evidence[c.dataset.ev]=c.checked;save()});

  const qin=el.querySelector('#qin');
  if(qin){qin.focus();qin.onkeydown=e=>{if(e.key==='Enter'){S.intake[Q[S.step].id]=qin.value.trim();S.step++;save();render()}}}
}

function bindModal(){
  const m=document.getElementById('modal');
  m.querySelectorAll('[data-close-btn]').forEach(b=>b.onclick=closeModal);
  m.querySelector('[data-close]')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
  m.querySelectorAll('[data-act="add-person"]').forEach(b=>b.onclick=()=>{modal(mPerson());bindModal()});

  const ft=m.querySelector('#f-type'), fi=m.querySelector('#f-inst');
  if(ft&&fi) ft.onchange=()=>{fi.innerHTML=(INST[ft.value]||['Other']).map(i=>`<option>${i}</option>`).join('');
    const v=m.querySelector('#f-via'); if(v) v.textContent=VIA_HINT[TYPE_OF(ft.value).via];
    const w=m.querySelector('#f-ifsc-wrap'); if(w) w.style.display=IFSC_TYPES.includes(ft.value)?'':'none';};
  const ib=m.querySelector('[data-ifsc-asset]');
  if(ib) ib.onclick=async()=>{
    const out=m.querySelector('#f-ifsc-out'); out.textContent='Looking up…';
    const r=await lookupIFSC(m.querySelector('#f-ifsc').value);
    if(!r.ok){out.textContent=r.msg;return}
    const b=r.data; out.innerHTML=`<span class="badge live-badge">Live</span> ${esc(b.BANK)}, ${esc(b.BRANCH)} &middot; ${esc(b.CITY)}, ${esc(b.STATE)}`;
    const opt=[...fi.options].find(o=>o.value.toLowerCase()===String(b.BANK).toLowerCase());
    if(opt) fi.value=opt.value; else { fi.insertAdjacentHTML('afterbegin',`<option>${esc(b.BANK)}</option>`); fi.value=b.BANK; }
    const ref=m.querySelector('#f-ref'); if(!ref.value) ref.value=`${b.BRANCH} branch, ${b.CITY} (IFSC ${b.IFSC})`;
  };

  m.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.save;
    if(k==='asset'){
      const t=m.querySelector('#f-type').value;
      const np=m.querySelector('#f-nomp');
      S.assets.push({id:uid(),type:t,inst:m.querySelector('#f-inst').value,ref:m.querySelector('#f-ref').value.trim(),nomAtInst:m.querySelector('#f-nom').value,nomPerson:np?np.value:''});
      logit('Holding added');toast('Holding added');
    }
    else if(k==='person'){
      const n=m.querySelector('#p-name').value.trim();
      if(!n){toast('Name is needed');return}
      S.people.push({id:uid(),name:n,rel:m.querySelector('#p-rel').value,phone:m.querySelector('#p-phone').value.trim()});
      logit('Person added');toast('Person added');
    }
    else if(k==='link'){
      const aid=b.dataset.aid;
      S.links=S.links.filter(l=>l.asset!==aid);
      m.querySelectorAll('[data-lk]').forEach(c=>{ if(c.checked){
        const pid=c.dataset.lk, sc=m.querySelector(`[data-sc="${pid}"]`).value;
        S.links.push({id:uid(),asset:aid,person:pid,scope:sc}); }});
      logit('Designation updated');toast('Saved \u2014 they\u2019ll be told they\u2019ve been named, not what');
    }
    else if(k==='ref'){ const l=S.leads.find(x=>x.id===b.dataset.id); l.ref=m.querySelector('#t-val').value.trim(); toast('Reference saved'); }
    else if(k==='note'){ const l=S.leads.find(x=>x.id===b.dataset.id); l.note=m.querySelector('#t-val').value.trim(); toast('Note saved'); }
    else if(k==='trace'){
      const n=m.querySelector('#tr-name').value.trim(); if(!n){toast('Name is needed');return}
      const kind=m.querySelector('#tr-kind').value;
      S.trace.push({id:uid(),name:n,kind});
      const type=kind.indexOf('Dividend')===0?'demat':'bank';
      S.leads.unshift({id:uid(),portal:type==='demat'?'iepf':'udgam',type,label:n+' — found in the AIS',
        why:'Reported tax on their PAN · held their money',score:97,status:'found',ref:'',note:'From Form 26AS / AIS'});
      logit('AIS institution added: '+n);toast('Added to your case file');
    }
    else if(k==='profile'){
      const n=m.querySelector('#pf-name').value.trim(), p=m.querySelector('#pf-pan').value.trim().toUpperCase();
      if(!n){toast('Name is needed');return}
      if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(p)){toast('That PAN doesn\u2019t look right');return}
      S.profile={name:n,pan:p};logit('Registry owner details saved');toast('Saved');
    }
    else if(k==='reset'){
      S={...S, journey:null,view:null,assets:[],people:[],links:[],reporters:[],event:null,log:[],
         intake:{},step:0,leads:[],docs:{},trace:[],evidence:{},filter:'all',profile:{},lookup:null,
         succ:{law:'hindu',gender:'male',will:'none',executor:''},chat:[],live:{}};
      try{localStorage.removeItem('amanat_v1')}catch(e){}
      toast('Prototype reset');
    }
    save();closeModal();render();
  });
}

boot();
</script>
